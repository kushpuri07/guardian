<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guardian — Choose a Repository</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  
  :root {
    --bg: #0d0a08;
    --bg-elev: #1a1410;
    --bg-card: #15100d;
    --steel: #2a2420;
    --steel-light: #3a322c;
    --gold: #d4a843;
    --gold-dim: #b8923a;
    --gold-pale: #e8d4a8;
    --crimson: #c0392b;
    --crimson-dim: #962d22;
    --ink: #f5efe8;
    --ink-muted: #9a8d7a;
    --ink-dim: #6b5f4d;
    --blade: #e8dcc8;
    --shadow: rgba(0,0,0,0.6);
    --shadow-gold: rgba(212,168,67,0.3);
    --shadow-crimson: rgba(192,57,43,0.3);
  }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 18px;
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  .scroll-video {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    pointer-events: none;
  }
  .scroll-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .scroll-video::after {
    content: '';
    position: absolute;
    inset: 0;
    background: none;
    pointer-events: none;
  }
  .scroll-video.fallback::after {
    background: linear-gradient(180deg, #0d0a08 0%, #1a1410 50%, #0d0a08 100%);
  }
  
  .vignette {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: none;
    pointer-events: none;
  }
  
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 40px;
    position: relative;
    z-index: 10;
  }
  
  @media (max-width: 768px) {
    .container { padding: 0 24px; }
  }
  
  nav {
    padding: 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--steel);
    position: relative;
  }
  nav::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  
  .logo {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: color 0.3s;
  }
  .logo:hover { color: var(--gold); }
  .logo-mark {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .logo-mark::before {
    content: '';
    position: absolute;
    width: 18px;
    height: 2px;
    background: var(--bg);
    transform: rotate(45deg);
  }
  .logo-mark::after {
    content: '';
    position: absolute;
    width: 2px;
    height: 18px;
    background: var(--bg);
    transform: rotate(45deg);
  }
  
  .nav-right { display: flex; align-items: center; gap: 16px; }
  
  .user-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--steel);
    border-radius: 24px;
    padding: 6px 16px 6px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-muted);
    transition: border-color 0.3s, background 0.3s;
  }
  .user-pill:hover { border-color: var(--gold); background: var(--bg-card); }
  .user-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--crimson));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 700; font-size: 11px;
    color: var(--bg);
  }
  
  .btn {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 12px 28px;
    border-radius: 4px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: var(--bg);
    border-color: var(--gold);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, var(--gold-pale), var(--gold));
    transform: translateY(-2px);
    box-shadow: 0 8px 32px var(--shadow-gold);
  }
  .btn-danger {
    background: transparent;
    color: var(--crimson);
    border-color: var(--crimson);
  }
  .btn-danger:hover {
    background: rgba(192,57,43,0.1);
    color: #e85d4f;
    box-shadow: 0 8px 32px var(--shadow-crimson);
  }
  .btn:disabled, .btn.loading {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }
  .btn-sm { padding: 8px 18px; font-size: 11px; }
  
  .page-header {
    padding: 80px 0 40px;
    text-align: center;
  }
  .page-header .section-label {
    display: inline-block;
    margin-bottom: 20px;
  }
  .page-header h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(36px, 6vw, 56px);
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .page-header p {
    font-size: clamp(16px, 2.5vw, 20px);
    color: var(--ink-muted);
    font-style: italic;
    max-width: 600px;
    margin: 0 auto;
  }
  
  .search-wrap { margin-bottom: 32px; position: relative; }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--gold); font-size: 16px; pointer-events: none;
  }
  input[type="text"] {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 14px 18px 14px 48px;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  input[type="text"]:focus { border-color: var(--gold-pale); box-shadow: 0 0 0 3px rgba(212,168,67,0.25); background: var(--bg-elev); }
  input[type="text"]::placeholder { color: var(--ink-muted); }
  
  .repo-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 60px; }
  
  .repo-card {
    background: var(--bg-card);
    border: 1px solid var(--steel);
    border-radius: 8px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .repo-card:hover { border-color: var(--steel-light); transform: translateX(4px); }
  .repo-card.protected { border-color: var(--gold); background: rgba(212,168,67,0.04); }
  
  .repo-icon {
    width: 44px; height: 44px; border-radius: 6px;
    background: var(--bg-elev);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  
  .repo-info { flex: 1; min-width: 0; }
  .repo-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .repo-meta {
    display: flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-muted);
  }
  .lang-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  .private-badge {
    background: rgba(58,50,44,0.5); border: 1px solid var(--steel);
    border-radius: 3px; padding: 2px 8px;
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  
  .protect-btn {
    flex-shrink: 0;
    font-family: 'Cinzel', serif; font-weight: 600; font-size: 12px;
    padding: 10px 20px; border-radius: 4px; border: none; cursor: pointer;
    transition: all 0.2s; letter-spacing: 0.05em;
  }
  .protect-btn.idle {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
  }
  .protect-btn.idle:hover { background: rgba(212,168,67,0.1); }
  .protect-btn.loading {
    background: transparent; border: 1px solid var(--steel); color: var(--ink-dim);
    cursor: not-allowed;
  }
  .protect-btn.done {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    border: 1px solid var(--gold);
    color: var(--bg);
    cursor: default;
  }
  .protect-btn.done:hover {
    background: linear-gradient(135deg, var(--gold-pale), var(--gold));
    box-shadow: 0 8px 32px var(--shadow-gold);
  }
  
  .empty {
    text-align: center; padding: 80px 20px;
    font-style: italic; color: var(--ink-muted);
  }
  
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg-elev);
    border: 1px solid var(--steel);
    border-radius: 6px;
    padding: 14px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
    z-index: 1000;
    max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--gold); }
  .toast.error { border-color: var(--crimson); }
  .toast-icon { flex-shrink: 0; width: 18px; height: 18px; }
  
  .loading-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 300px; gap: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-muted);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 2px solid var(--steel);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .kanji {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(80px, 15vw, 160px);
    line-height: 1;
    color: rgba(212,168,67,0.04);
    position: absolute;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
  
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s cubic-bezier(0.16,1,0.3,1), transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal-delay-1 { transition-delay: 0.1s; }
  .reveal-delay-2 { transition-delay: 0.2s; }
  .reveal-delay-3 { transition-delay: 0.3s; }
</style>
</head>
<body>
<!-- REPOS_DATA -->
<div class="scroll-video" id="scrollVideo">
  <video id="bgVideo" playsinline muted loop preload="metadata" poster="/static/video/poster.jpg">
    <source src="/static/video/samurai-1080.mp4" type="video/mp4">
  </video>
</div>
<div class="vignette"></div>

<div class="container">
  <nav>
    <a href="/" class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="36" height="36">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      GUARDIAN
    </a>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="user-pill" id="userPill">
        <div class="user-avatar" id="userAvatar">?</div>
        <span id="userName">loading…</span>
      </div>
      <a id="logoutBtn" href="#" class="btn btn-sm" style="background:transparent;color:var(--ink-muted);border-color:var(--steel);padding:8px 16px;font-size:11px;">logout</a>
    </div>
  </nav>

  <header class="page-header reveal">
    <span class="section-label">選択</span>
    <h1>Choose a Repository<br/>to <span class="accent">Protect</span></h1>
    <p>Guardian will watch every pull request. Three agents. Zero configuration.</p>
  </header>

  <div class="search-wrap reveal reveal-delay-1">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search repositories…"/>
  </div>

  <div class="repo-list" id="repoList">
    <div class="loading-screen">
      <div class="spinner"></div>
      Loading your repositories…
    </div>
  </div>
</div>

<div class="kanji" style="top: 30%; right: -100px; transform: rotate(-10deg);">守</div>
<div class="kanji" style="bottom: 20%; left: -80px; transform: rotate(15deg);">護</div>

<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="/static/js/scroll-video.js"></script>
<script>
const SESSION = window.SESSION || '';
const REPOS   = window.REPOS   || [];
document.getElementById('logoutBtn').href = `/auth/logout?session=${SESSION}`;

const LANG_COLORS = {
  Python: '#3572A5', JavaScript: '#f1e05a', TypeScript: '#2b7489',
  Go: '#00ADD8', Rust: '#dea584', Java: '#b07219',
  Ruby: '#701516', PHP: '#4F5D95', 'C++': '#f34b7d',
  C: '#555555', Swift: '#ffac45', Kotlin: '#F18E33',
};

function langColor(lang) { return LANG_COLORS[lang] || '#d4a843'; }

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr);
  const d = Math.floor(diff / 86400000);
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 30)  return `${d}d ago`;
  return `${Math.floor(d/30)}mo ago`;
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  const icon = type === 'success' 
    ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#d4a843" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  t.innerHTML = icon + msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 4000);
}

async function protectRepo(repoName, btn) {
  if (btn.classList.contains('done')) {
    btn.className = 'protect-btn loading';
    btn.textContent = 'Removing…';
    try {
      const res = await fetch('/repos/unprotect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: SESSION, repo: repoName })
      });
      const data = await res.json();
      if (data.status === 'unprotected') {
        btn.className = 'protect-btn idle';
        btn.textContent = 'Protect';
        btn.closest('.repo-card').classList.remove('protected');
        showToast(`${repoName} unprotected`, 'success');
      }
    } catch {
      btn.className = 'protect-btn done';
      btn.textContent = 'Protected';
    }
    return;
  }

  btn.className = 'protect-btn loading';
  btn.textContent = 'Connecting…';

  try {
    const res = await fetch('/repos/protect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: SESSION, repo: repoName })
    });
    const data = await res.json();

    if (data.status === 'protected') {
      btn.className = 'protect-btn done';
      btn.textContent = 'Protected';
      btn.closest('.repo-card').classList.add('protected');
      showToast(`${repoName} is now protected`, 'success');
    } else {
      throw new Error(data.detail || 'Unknown error');
    }
  } catch (err) {
    btn.className = 'protect-btn idle';
    btn.textContent = 'Protect';
    showToast('Failed: ' + err.message, 'error');
  }
}

function renderRepos(repos) {
  const list = document.getElementById('repoList');

  if (!repos.length) {
    list.innerHTML = '<div class="empty reveal">No repositories found.</div>';
    return;
  }

  list.innerHTML = repos.map((r, i) => `
    <div class="repo-card reveal reveal-delay-${(i % 3) + 1}" data-repo="${r.name}">
      <div class="repo-icon">
        ${r.private
          ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
          : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'
        }
      </div>
      <div class="repo-info">
        <div class="repo-name">${r.name}</div>
        <div class="repo-meta">
          ${r.language ? `<div class="lang-dot" style="background:${langColor(r.language)}"></div><span>${r.language}</span>` : ''}
          ${r.private ? '<span class="private-badge">private</span>' : ''}
          <span>${timeAgo(r.updated)}</span>
        </div>
      </div>
      <button class="protect-btn idle" onclick="protectRepo('${r.name}', this)">Protect</button>
    </div>
  `).join('');

  // Observe new reveal elements
  document.querySelectorAll('.repo-card.reveal').forEach(el => revealObserver.observe(el));
}

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  const filtered = REPOS.filter(r => r.name.toLowerCase().includes(q));
  renderRepos(filtered);
});

function initUser() {
  if (!SESSION) return;
  const firstRepo = REPOS[0];
  if (firstRepo) {
    const username = firstRepo.name.split('/')[0];
    document.getElementById('userAvatar').textContent = username[0].toUpperCase();
    document.getElementById('userName').textContent = username;
  }
}

async function loadProtectedRepos() {
  try {
    const r = await fetch('/protected-repos');
    const data = await r.json();
    data.repos.forEach(repoName => {
      const card = document.querySelector(`[data-repo="${repoName}"]`);
      if (card) {
        card.classList.add('protected');
        const btn = card.querySelector('.protect-btn');
        if (btn) {
          btn.className = 'protect-btn done';
          btn.textContent = 'Protected';
        }
      }
    });
  } catch(e) {}
}

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

initUser();
renderRepos(REPOS);
setTimeout(loadProtectedRepos, 100);
</script>
</body>
</html>
