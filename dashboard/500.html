<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>500 — Guardian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0d0a08;
    --bg-elev: #1a1410;
    --bg-card: #15100d;
    --steel: #2a2420;
    --steel-light: #3a322c;
    --gold: #d4a843;
    --gold-dim: #b8923a;
    --gold-pale: #e8d4a8;
    --crimson: #c0392b;
    --ink: #f5efe8;
    --ink-muted: #9a8d7a;
    --ink-dim: #6b5f4d;
    --blade: #e8dcc8;
    --shadow: rgba(0,0,0,0.6);
    --shadow-gold: rgba(212,168,67,0.3);
    --shadow-crimson: rgba(192,57,43,0.3);
  }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 18px;
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  .scroll-video {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    pointer-events: none;
  }
  .scroll-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .scroll-video::after {
    content: '';
    position: absolute;
    inset: 0;
    background: none;
    pointer-events: none;
  }
  .scroll-video.fallback::after {
    background: linear-gradient(180deg, #0d0a08 0%, #1a1410 50%, #0d0a08 100%);
  }
  
  .vignette {
    position: fixed;
    inset: 0;
    z-index: -1;
    display: none;
    pointer-events: none;
  }
  
  .container {
    max-width: 500px;
    padding: 0 40px;
    text-align: center;
    position: relative;
    z-index: 10;
  }
  
  .error-code {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(120px, 25vw, 200px);
    line-height: 1;
    color: rgba(192,57,43,0.15);
    position: relative;
    margin-bottom: 24px;
    animation: codeShake 0.5s ease-in-out infinite;
  }
  @keyframes codeShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .error-code::after {
    content: '500';
    position: absolute;
    top: 0; left: 0;
    color: var(--crimson);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    animation: codeReveal 3s ease-in-out infinite;
  }
  @keyframes codeReveal {
    0% { clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%); }
    50% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
    100% { clip-path: polygon(0 0, 100% 0, 100% 0, 0 0); }
  }
  
  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.2;
    margin-bottom: 16px;
  }
  h1 .accent { color: var(--crimson); }
  
  .desc {
    font-size: 18px;
    color: var(--ink-muted);
    font-style: italic;
    margin-bottom: 48px;
    line-height: 1.7;
  }
  
  .btn {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 14px 36px;
    border-radius: 4px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--crimson), var(--crimson-dim));
    color: var(--ink);
    border-color: var(--crimson);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #e85d4f, var(--crimson));
    transform: translateY(-2px);
    box-shadow: 0 8px 32px var(--shadow-crimson);
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink-muted);
    border-color: var(--steel);
    margin-left: 16px;
  }
  .btn-ghost:hover {
    color: var(--ink);
    border-color: var(--gold);
    background: rgba(212,168,67,0.08);
  }
  
  .kanji {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(80px, 20vw, 160px);
    line-height: 1;
    color: rgba(192,57,43,0.04);
    position: absolute;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="scroll-video" id="scrollVideo">
  <video id="bgVideo" playsinline muted loop preload="metadata" poster="/static/video/poster.jpg">
    <source src="/static/video/samurai-1080.mp4" type="video/mp4">
  </video>
</div>
<div class="vignette"></div>

<div class="kanji" style="top: 20%; right: -80px; transform: rotate(-15deg);">乱</div>
<div class="kanji" style="bottom: 20%; left: -60px; transform: rotate(10deg);">気</div>

<div class="container">
  <div class="error-code">500</div>
  <h1>Internal <span class="accent">Error</span></h1>
  <p class="desc">The guardian's blade has dulled. Our engineers have been alerted and are forging a fix.</p>
  <div>
    <a href="/" class="btn btn-primary">Return to Safety</a>
    <a href="#" onclick="location.reload()" class="btn btn-ghost">Retry</a>
  </div>
</div>

<script src="/static/js/scroll-video.js"></script>
<script>
const video = document.getElementById('bgVideo');
if (video) {
  video.muted = true;
  video.playsInline = true;
  video.play().catch(() => {
    document.getElementById('scrollVideo').classList.add('fallback');
  });
}
</script>
</body>
</html>
